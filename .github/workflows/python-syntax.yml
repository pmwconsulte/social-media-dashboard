name: Python validation and tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/instagram-direct-reply
      - feature/instagram-direct-inbox-phase1
      - test/whatsapp-template-security

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile Python modules
        run: python -m compileall -q .

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run automated tests
        run: pytest -q test_instagram_inbox.py test_payments.py test_whatsapp_template.py
